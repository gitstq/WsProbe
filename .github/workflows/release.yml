name: Release

# WsProbe 屬於「工具函式庫 / CLI」類專案,pip 安裝即可使用,
# 因此 Release 以原始碼歸檔 + 校驗碼為主。
# 若日後需要單一可執行檔,可在對應系統的 runner 上執行 ./scripts/build.sh
# (PyInstaller 不支援交叉編譯,必須在目標平台上建置)。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-executables:
    name: Build single-file binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wsprobe-linux
          - os: macos-latest
            artifact: wsprobe-macos
          - os: windows-latest
            artifact: wsprobe-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build with PyInstaller
        shell: bash
        run: |
          pip install pyinstaller
          ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/wsprobe*

  release:
    name: Publish release
    needs: build-executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create source archives with checksums
        run: |
          mkdir -p release
          tar czf release/wsprobe-source.tar.gz \
            --exclude='.git' --exclude='dist' --exclude='__pycache__' .
          zip -qr release/wsprobe-source.zip . \
            -x '.git/*' 'dist/*' '*/__pycache__/*'
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
            artifacts/**/*
