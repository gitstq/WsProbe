[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wsprobe"
version = "1.0.0"
description = "WsProbe — 零依赖 WebSocket 调试探针(RFC 6455 自研协议栈,CLI + 库)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "WsProbe Contributors" }]
keywords = [
    "websocket",
    "rfc6455",
    "cli",
    "debug",
    "probe",
    "network",
    "zero-dependency",
    "wss",
    "benchmark",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Networking",
]
# 运行时零第三方依赖:仅使用 Python 标准库
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=5.0",
]

[project.scripts]
wsprobe = "wsprobe.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/WsProbe"
Repository = "https://github.com/gitstq/WsProbe"
Issues = "https://github.com/gitstq/WsProbe/issues"

[tool.setuptools]
packages = ["wsprobe"]

[tool.setuptools.package-data]
wsprobe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
